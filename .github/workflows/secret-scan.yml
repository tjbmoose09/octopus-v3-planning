name: Secret and State Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Block secrets and local state
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan tracked files for sensitive paths and token patterns
        shell: python
        run: |
          import re
          import subprocess
          import sys
          from pathlib import Path

          blocked_paths = re.compile(
              r"(^|/)(\.env|\.claude)(/|$)|"
              r"(^|/)(node_modules|vault|memory|logs)(/|$)|"
              r"(^|/).*\.((db)|(sqlite)|(sqlite3))$|"
              r"(^|/)database/.*\.db$",
              re.IGNORECASE,
          )
          secret_patterns = re.compile(
              r"sk-ant-api03-[A-Za-z0-9_\-]{15,}|"
              r"ghp_[A-Za-z0-9_]{20,}|"
              r"github_pat_[A-Za-z0-9_]{40,}|"
              r"sk-[A-Za-z0-9]{20,}|"
              r"xox[baprs]-[A-Za-z0-9-]{10,}|"
              r"AKIA[0-9A-Z]{16}|"
              r"-----BEGIN (RSA |OPENSSH |EC |DSA |)?PRIVATE KEY-----|"
              r"(ANTHROPIC_API_KEY|OPENAI_API_KEY|GITHUB_TOKEN)\s*=\s*[^\s#<>]+",
              re.IGNORECASE,
          )

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          failures = []

          for path_text in tracked:
              normalized = path_text.replace("\\", "/")
              if blocked_paths.search(normalized):
                  failures.append(f"blocked path: {path_text}")
                  continue

              path = Path(path_text)
              try:
                  content = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  content = path.read_text(encoding="utf-8", errors="ignore")

              for match in secret_patterns.finditer(content):
                  line_no = content.count("\n", 0, match.start()) + 1
                  failures.append(f"secret-like pattern in {path_text}:{line_no}")

          if failures:
              print("Sensitive content scan failed:")
              for failure in failures:
                  print(f"- {failure}")
              sys.exit(1)

          print(f"Scanned {len(tracked)} tracked files; no sensitive paths or token patterns found.")

